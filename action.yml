name: agentpath
description: Find attack paths in the tools an AI agent can call, and report them to code scanning.
author: Shaiq
branding:
  icon: git-branch
  color: purple

inputs:
  manifest:
    description: >
      Path to an agent manifest to analyse. If omitted, the action runs
      `agentpath collect --no-launch` first, which reads any agent configuration
      committed to the repository without executing anything.
    required: false
    default: ""
  policy:
    description: Path to an .agentpath.yml file. Defaults to one in the working directory.
    required: false
    default: ""
  baseline:
    description: >
      Path to a baseline file. Findings in it are still reported but do not fail
      the run, so a repository can adopt the tool without fixing everything first.
    required: false
    default: ""
  fail-on:
    description: Fail the step when a finding at this severity or above is not baselined.
    required: false
    default: high
  sarif-file:
    description: Where to write SARIF output for upload to code scanning.
    required: false
    default: agentpath.sarif
  python-version:
    description: Python version to run on.
    required: false
    default: "3.12"

outputs:
  sarif-file:
    description: Path to the SARIF file that was written.
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install agentpath
      shell: bash
      # Install the copy of agentpath that ships with this action, so the code
      # and the action version can never drift apart.
      run: pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Analyse
      id: run
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
        POLICY: ${{ inputs.policy }}
        BASELINE: ${{ inputs.baseline }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail

        manifest="$MANIFEST"
        if [ -z "$manifest" ]; then
          # No manifest given, so read whatever configuration is committed here.
          # --no-launch means nothing from the repository is ever executed, which
          # matters when the workflow can be triggered by a pull request.
          if agentpath collect --no-launch -o agentpath-manifest.json; then
            manifest=agentpath-manifest.json
          else
            # A repository with no agent configuration is not a failure, and it
            # is not a pass either. Say which one it is rather than letting an
            # empty result read as a clean one.
            echo "::notice::agentpath found no agent configuration in this repository."
            echo "Nothing was scanned. This is not the same as scanning and finding nothing."
            echo "Point the action at a manifest with the 'manifest' input if your agent"
            echo "configuration lives somewhere this does not look."
            cat > "$SARIF" <<'EMPTY'
        {"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"agentpath","informationUri":"https://github.com/Shaiq250/agentpath","rules":[]}},"results":[],"invocations":[{"executionSuccessful":true,"toolExecutionNotifications":[{"level":"note","message":{"text":"No agent configuration was found in this repository, so nothing was scanned."}}]}]}]}
        EMPTY
            echo "sarif-file=$SARIF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        # Written as if blocks rather than `[ -n "$X" ] && args+=(...)`, because
        # under `set -e` that form aborts the whole step whenever the input is
        # empty: the and list returns the exit status of a failed test.
        extra=()
        if [ -n "$POLICY" ]; then extra+=(--policy "$POLICY"); fi
        if [ -n "$BASELINE" ]; then extra+=(--baseline "$BASELINE"); fi

        echo "sarif-file=$SARIF" >> "$GITHUB_OUTPUT"

        # A readable report in the job log as well, since SARIF is for machines
        # and whoever opens the log wants prose. This one is allowed to fail,
        # because findings make it exit non zero and that is not an error here.
        agentpath analyze "$manifest" "${extra[@]+"${extra[@]}"}" || true

        agentpath analyze "$manifest" --format sarif -o "$SARIF" \
          --fail-on "$FAIL_ON" "${extra[@]+"${extra[@]}"}"
