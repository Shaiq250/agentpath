[project]
name = "agentpath"
version = "0.1.0"
description = "Offline attack path analyser for AI agents and their tools"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
agentpath = "agentpath.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
